# Example nginx for aimarker.seamo-official.org
# Frontend static files + reverse-proxy to uvicorn on 127.0.0.1:8000
#
# Without the location blocks below, the SPA catches /health, /upload, etc.
# and the browser never reaches the API. Do NOT point the frontend at
# http://localhost:8000 or http://SERVER_IP:8000 from an HTTPS page (mixed content).

server {
    listen 80;
    server_name aimarker.seamo-official.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aimarker.seamo-official.org;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /var/www/aimarker/frontend/dist;   # adjust to where `npm run build` output is deployed
    index index.html;

    # --- API (FastAPI / uvicorn) ---
    # Keep this list in sync with backend routes; "fallback to SPA" must come last.
    location ~ ^/(health|docs|redoc|openapi\.json|upload|status|submission|submissions|templates|extract|answer-keys|exams|jsons|marking)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sync extract can take many minutes on large PDFs
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 50m;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
