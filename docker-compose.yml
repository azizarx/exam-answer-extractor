services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-app

    ports:
      - "8000:8000"

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/data/exam_db.sqlite
      APP_ENV: production
      DEBUG: "false"

    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
